<style>
:root{--bg:#050505;--card:#111111;--text:#f5f5f5;--muted:#9a9a9a;--red:#e10600;--red2:#ff2a1f;--line:#2a2a2a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;
background:radial-gradient(ellipse at 50% -10%,rgba(225,6,0,.28),transparent 55%),var(--bg)}
main{max-width:480px;margin:0 auto;padding:28px 20px 44px;text-align:center}
.logo{width:220px;height:220px;margin:0 auto 6px;display:block;object-fit:cover;
-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 71%);mask-image:radial-gradient(circle,#000 58%,transparent 71%)}
h1{margin:0;font-family:'Montserrat','Cairo',Arial,sans-serif;font-size:30px;font-weight:900;font-style:italic;letter-spacing:1px}
h1 span{color:var(--red2)}
.tag{margin:4px 0 26px;color:var(--muted);font-family:'Montserrat','Cairo',Arial,sans-serif;font-size:13px;letter-spacing:4px;font-weight:600}
a.link{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--red);
border-radius:14px;padding:15px 18px;margin-bottom:12px;color:var(--text);text-decoration:none;font-weight:700;font-size:17px;
transition:transform .15s,background .15s,border-color .15s}
a.link:hover,a.link:focus-visible{transform:translateY(-2px);background:#1a0a09;border-color:var(--red2)}
a.link:active{transform:scale(.98)}
.go{margin-inline-start:auto;color:var(--red2);font-weight:900}
.ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.ic svg{width:25px;height:25px;display:block}
.lbl{display:flex;flex-direction:column;gap:2px;line-height:1.3;min-width:0;text-align:start}
.lbl b{display:block;font-family:'Montserrat','Cairo',Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:.3px;direction:ltr;text-align:start;unicode-bidi:plaintext}
.lbl small{display:block;font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:14px;font-weight:600;color:var(--muted)}
footer{margin-top:26px;color:var(--muted);font-size:13px}
</style>
</head>
